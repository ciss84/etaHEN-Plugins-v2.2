; Configuration Injector avec Shellcode
; Fichier: /data/PluginLoader/PluginLoader.ini
;
; Format:
; [TITLE_ID]
; filename.prx:frame_delay
;
; frame_delay: nombre de frames à attendre (60 = 1 sec, 600 = 10 sec)
; Si pas spécifié, utilise 60 frames par défaut
; Exemple
; [PPSA0426X]
; prx/LSO-1.010.prx:60
; prx/BeachMenu-1.010.002.prx:600

; Exemple
; [DEFAULT] ONLY FOR PS5 GAME
; fakelib=true
; or use fakelib=false for fw no need fakelib 

