[loader]
timeout_s = 60
scan_existing = true
default_inject = true
default_restore_sandbox = true

[[plugin]]
title                = "PPSA04263"
path                 = "/data/PluginLoader/prx/LSO-1.010.prx"
fakelib_delay_frames = 0     # 0 s avant le montage du fakelib
delay_frames         = 60     # 1 s après le montage -> injection de LSO
inject               = true
restore_sandbox      = true

[[plugin]]
title           = "PPSA04263"
path            = "/data/PluginLoader/prx/BeachMenu-1.010.002.prx"
delay_frames    = 600          # 10 s après le montage -> injection de BeachMenu
inject          = true
restore_sandbox = true