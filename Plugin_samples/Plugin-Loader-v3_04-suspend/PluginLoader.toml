# Copier dans /data/PluginLoader/PluginLoader.toml
# [loader] est optionnel :  default_restore_sandbox = true
# restore_sandbox (par plugin, défaut true) : restaure ucred/rootdir/jaildir du jeu après injection
# method (par plugin, défaut "ptrace") : "ptrace" = injection ptrace (tous firmwares)
#                                        "plt"    = hook scePadReadState (méthode v2.02, pas sur tous les FW)
# suspend_game (par plugin, défaut false) : ptrace seulement — les autres threads du jeu restent
#                                           suspendus (PT_SUSPEND) pendant le chargement du PRX
# sync_load (par plugin, défaut true) : true = chargement direct dans le thread du jeu (comme ploader)
#                                       false = ancien mode pthread
# path relatif => /data/PluginLoader/<path>  (chemin absolu accepté)

[[plugin]]
title    = "CUSA00411"
path     = "prx/BeachMenu157.prx"
delay_ms = 10000      # défaut 10000
inject   = true       # false = ignoré

[[plugin]]
title    = "CUSA00419"
path     = "prx/BeachMenu157.prx"
delay_ms = 10000      # défaut 10000
inject   = true       # false = ignoré

